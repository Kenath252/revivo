<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Robotic boxing movement state diagram</title>
  <desc id="desc">A schematic diagram showing straight punch, hook, uppercut, and dodge movements as pose sequences from guard through preparation, action, and recovery.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d5dde8; stroke-width: 1.4; rx: 10; }
      .header { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #162033; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5a6a; }
      .rowTitle { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #162033; }
      .state { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2d3d; }
      .caption { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536273; }
      .note { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .stage { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: .5px; }
      .robotBase { fill: #243447; }
      .joint { fill: #ffffff; stroke: #243447; stroke-width: 3; }
      .arm { fill: none; stroke: #2563eb; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .forearm { fill: none; stroke: #0f766e; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .glove { fill: #ef4444; stroke: #991b1b; stroke-width: 3; }
      .path { fill: none; stroke: #f59e0b; stroke-width: 3; stroke-dasharray: 7 6; marker-end: url(#arrowAmber); }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrowSlate); }
      .smallArrow { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrowSlate); }
      .tagPrep { fill: #475569; }
      .tagAction { fill: #dc2626; }
      .tagRecover { fill: #0f766e; }
      .tagGuard { fill: #1d4ed8; }
      .legendBox { fill: #eef2f7; stroke: #d5dde8; stroke-width: 1; rx: 8; }
    </style>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="980" />

  <text class="header" x="52" y="52">Robotic boxing movements as finite-state pose sequences</text>
  <text class="subtitle" x="52" y="80">Each movement starts from GUARD, moves through a preparation pose, performs the visible action, then recovers through IDLE back to GUARD.</text>

  <rect class="legendBox" x="1035" y="30" width="310" height="68" />
  <circle class="glove" cx="1062" cy="64" r="10" />
  <text class="note" x="1080" y="68">Red circle = glove/end-effector</text>
  <path class="arm" d="M 1240 55 L 1280 55" />
  <path class="forearm" d="M 1240 76 L 1280 76" />
  <text class="note" x="1290" y="68">arm links</text>

  <!-- Straight punch row -->
  <text class="rowTitle" x="52" y="132">1. Straight punch / jab-like movement</text>
  <text class="caption" x="52" y="154">Sequence: GUARD -> PRE_PUNCH -> PUNCH -> IDLE -> GUARD</text>

  <g transform="translate(52 172)">
    <rect class="panel" x="0" y="0" width="248" height="155" />
    <rect class="tagGuard" x="16" y="16" width="62" height="22" rx="5" />
    <text class="stage" x="28" y="31">START</text>
    <text class="state" x="16" y="58">GUARD</text>
    <text class="caption" x="16" y="76">Arm held close in defensive posture</text>
    <rect class="robotBase" x="42" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="78" cy="108" r="10" />
    <path class="arm" d="M 78 108 L 107 64" />
    <path class="forearm" d="M 107 64 L 139 47" />
    <circle class="joint" cx="107" cy="64" r="8" />
    <circle class="glove" cx="139" cy="47" r="13" />
  </g>

  <path class="arrow" d="M 310 248 L 366 248" />

  <g transform="translate(374 172)">
    <rect class="panel" x="0" y="0" width="248" height="155" />
    <rect class="tagPrep" x="16" y="16" width="88" height="22" rx="5" />
    <text class="stage" x="28" y="31">PREPARE</text>
    <text class="state" x="16" y="58">PRE_PUNCH</text>
    <text class="caption" x="16" y="76">Arm draws back and loads the strike</text>
    <rect class="robotBase" x="42" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="78" cy="108" r="10" />
    <path class="arm" d="M 78 108 L 100 70" />
    <path class="forearm" d="M 100 70 L 128 61" />
    <circle class="joint" cx="100" cy="70" r="8" />
    <circle class="glove" cx="128" cy="61" r="13" />
    <path class="path" d="M 146 62 C 164 61, 183 61, 202 62" />
  </g>

  <path class="arrow" d="M 632 248 L 688 248" />

  <g transform="translate(696 172)">
    <rect class="panel" x="0" y="0" width="248" height="155" />
    <rect class="tagAction" x="16" y="16" width="72" height="22" rx="5" />
    <text class="stage" x="28" y="31">STRIKE</text>
    <text class="state" x="16" y="58">PUNCH</text>
    <text class="caption" x="16" y="76">Shoulder extends and elbow opens forward</text>
    <rect class="robotBase" x="42" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="78" cy="108" r="10" />
    <path class="arm" d="M 78 108 L 130 73" />
    <path class="forearm" d="M 130 73 L 199 63" />
    <circle class="joint" cx="130" cy="73" r="8" />
    <circle class="glove" cx="199" cy="63" r="13" />
    <path class="path" d="M 122 62 C 146 56, 174 55, 200 62" />
  </g>

  <path class="arrow" d="M 954 248 L 1010 248" />

  <g transform="translate(1018 172)">
    <rect class="panel" x="0" y="0" width="310" height="155" />
    <rect class="tagRecover" x="16" y="16" width="86" height="22" rx="5" />
    <text class="stage" x="28" y="31">RECOVER</text>
    <text class="state" x="16" y="58">IDLE -> GUARD</text>
    <text class="caption" x="16" y="76">Arm retracts after contact and returns to protection</text>
    <rect class="robotBase" x="54" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="90" cy="108" r="10" />
    <path class="arm" d="M 90 108 L 122 82" />
    <path class="forearm" d="M 122 82 L 159 80" />
    <circle class="joint" cx="122" cy="82" r="8" />
    <circle class="glove" cx="159" cy="80" r="13" />
    <path class="smallArrow" d="M 177 80 C 207 82, 231 67, 250 47" />
  </g>

  <!-- Hook row -->
  <text class="rowTitle" x="52" y="377">2. Hook movement</text>
  <text class="caption" x="52" y="399">Sequence: GUARD -> PRE_HOOK_LEFT or PRE_HOOK_RIGHT -> HOOK -> IDLE -> GUARD</text>

  <g transform="translate(52 417)">
    <rect class="panel" x="0" y="0" width="248" height="155" />
    <rect class="tagGuard" x="16" y="16" width="62" height="22" rx="5" />
    <text class="stage" x="28" y="31">START</text>
    <text class="state" x="16" y="58">GUARD</text>
    <text class="caption" x="16" y="76">Central protected stance</text>
    <rect class="robotBase" x="42" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="78" cy="108" r="10" />
    <path class="arm" d="M 78 108 L 107 64" />
    <path class="forearm" d="M 107 64 L 139 47" />
    <circle class="joint" cx="107" cy="64" r="8" />
    <circle class="glove" cx="139" cy="47" r="13" />
  </g>

  <path class="arrow" d="M 310 493 L 366 493" />

  <g transform="translate(374 417)">
    <rect class="panel" x="0" y="0" width="248" height="155" />
    <rect class="tagPrep" x="16" y="16" width="88" height="22" rx="5" />
    <text class="stage" x="28" y="31">PREPARE</text>
    <text class="state" x="16" y="58">PRE_HOOK_LEFT / RIGHT</text>
    <text class="caption" x="16" y="76">Base rotates sideways to load a lateral punch</text>
    <rect class="robotBase" x="42" y="108" width="72" height="18" rx="5" transform="rotate(-10 78 117)" />
    <circle class="joint" cx="78" cy="108" r="10" />
    <path class="arm" d="M 78 108 L 92 69" />
    <path class="forearm" d="M 92 69 L 121 55" />
    <circle class="joint" cx="92" cy="69" r="8" />
    <circle class="glove" cx="121" cy="55" r="13" />
    <path class="path" d="M 121 55 C 160 37, 198 43, 216 70" />
  </g>

  <path class="arrow" d="M 632 493 L 688 493" />

  <g transform="translate(696 417)">
    <rect class="panel" x="0" y="0" width="248" height="155" />
    <rect class="tagAction" x="16" y="16" width="72" height="22" rx="5" />
    <text class="stage" x="28" y="31">SWEEP</text>
    <text class="state" x="16" y="58">HOOK</text>
    <text class="caption" x="16" y="76">Arm sweeps from side-loaded pose to centre</text>
    <rect class="robotBase" x="42" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="78" cy="108" r="10" />
    <path class="arm" d="M 78 108 L 130 73" />
    <path class="forearm" d="M 130 73 L 196 72" />
    <circle class="joint" cx="130" cy="73" r="8" />
    <circle class="glove" cx="196" cy="72" r="13" />
    <path class="path" d="M 124 52 C 150 52, 181 58, 198 72" />
  </g>

  <path class="arrow" d="M 954 493 L 1010 493" />

  <g transform="translate(1018 417)">
    <rect class="panel" x="0" y="0" width="310" height="155" />
    <rect class="tagRecover" x="16" y="16" width="86" height="22" rx="5" />
    <text class="stage" x="28" y="31">RECOVER</text>
    <text class="state" x="16" y="58">IDLE -> GUARD</text>
    <text class="caption" x="16" y="76">Robot recentres and brings arm back to guard</text>
    <rect class="robotBase" x="54" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="90" cy="108" r="10" />
    <path class="arm" d="M 90 108 L 123 82" />
    <path class="forearm" d="M 123 82 L 158 78" />
    <circle class="joint" cx="123" cy="82" r="8" />
    <circle class="glove" cx="158" cy="78" r="13" />
    <path class="smallArrow" d="M 178 78 C 206 75, 232 62, 252 47" />
  </g>

  <!-- Uppercut row -->
  <text class="rowTitle" x="52" y="622">3. Uppercut movement</text>
  <text class="caption" x="52" y="644">Designed sequence: GUARD -> PRE_UPPERCUT -> UPPERCUT -> IDLE -> GUARD</text>

  <g transform="translate(52 662)">
    <rect class="panel" x="0" y="0" width="248" height="155" />
    <rect class="tagGuard" x="16" y="16" width="62" height="22" rx="5" />
    <text class="stage" x="28" y="31">START</text>
    <text class="state" x="16" y="58">GUARD</text>
    <text class="caption" x="16" y="76">Protected starting posture</text>
    <rect class="robotBase" x="42" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="78" cy="108" r="10" />
    <path class="arm" d="M 78 108 L 107 64" />
    <path class="forearm" d="M 107 64 L 139 47" />
    <circle class="joint" cx="107" cy="64" r="8" />
    <circle class="glove" cx="139" cy="47" r="13" />
  </g>

  <path class="arrow" d="M 310 738 L 366 738" />

  <g transform="translate(374 662)">
    <rect class="panel" x="0" y="0" width="248" height="155" />
    <rect class="tagPrep" x="16" y="16" width="88" height="22" rx="5" />
    <text class="stage" x="28" y="31">PREPARE</text>
    <text class="state" x="16" y="58">PRE_UPPERCUT</text>
    <text class="caption" x="16" y="76">Arm chambers low before rising</text>
    <rect class="robotBase" x="42" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="78" cy="108" r="10" />
    <path class="arm" d="M 78 108 L 125 120" />
    <path class="forearm" d="M 125 120 L 154 101" />
    <circle class="joint" cx="125" cy="120" r="8" />
    <circle class="glove" cx="154" cy="101" r="13" />
    <path class="path" d="M 158 98 C 163 80, 174 61, 193 47" />
  </g>

  <path class="arrow" d="M 632 738 L 688 738" />

  <g transform="translate(696 662)">
    <rect class="panel" x="0" y="0" width="248" height="155" />
    <rect class="tagAction" x="16" y="16" width="72" height="22" rx="5" />
    <text class="stage" x="28" y="31">RISE</text>
    <text class="state" x="16" y="58">UPPERCUT</text>
    <text class="caption" x="16" y="76">Glove travels upward from the chambered pose</text>
    <rect class="robotBase" x="42" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="78" cy="108" r="10" />
    <path class="arm" d="M 78 108 L 121 75" />
    <path class="forearm" d="M 121 75 L 161 40" />
    <circle class="joint" cx="121" cy="75" r="8" />
    <circle class="glove" cx="161" cy="40" r="13" />
    <path class="path" d="M 154 101 C 158 81, 159 60, 161 40" />
  </g>

  <path class="arrow" d="M 954 738 L 1010 738" />

  <g transform="translate(1018 662)">
    <rect class="panel" x="0" y="0" width="310" height="155" />
    <rect class="tagRecover" x="16" y="16" width="86" height="22" rx="5" />
    <text class="stage" x="28" y="31">RECOVER</text>
    <text class="state" x="16" y="58">IDLE -> GUARD</text>
    <text class="caption" x="16" y="76">Arm drops back from high strike to guard</text>
    <rect class="robotBase" x="54" y="108" width="72" height="18" rx="5" />
    <circle class="joint" cx="90" cy="108" r="10" />
    <path class="arm" d="M 90 108 L 123 82" />
    <path class="forearm" d="M 123 82 L 158 78" />
    <circle class="joint" cx="123" cy="82" r="8" />
    <circle class="glove" cx="158" cy="78" r="13" />
    <path class="smallArrow" d="M 166 62 C 191 70, 222 62, 252 47" />
  </g>

  <!-- Dodge summary strip -->
  <g transform="translate(52 865)">
    <rect class="panel" x="0" y="0" width="1276" height="78" />
    <text class="rowTitle" x="20" y="29">4. Defensive dodge</text>
    <text class="caption" x="20" y="52">Sequence: GUARD -> DODGE_LEFT or DODGE_RIGHT -> IDLE -> GUARD. The robot shifts its base sideways while keeping a guarded arm position.</text>
    <rect class="robotBase" x="760" y="42" width="66" height="16" rx="5" transform="rotate(-12 793 50)" />
    <circle class="joint" cx="793" cy="42" r="8" />
    <path class="arm" d="M 793 42 L 826 20" />
    <path class="forearm" d="M 826 20 L 860 18" />
    <circle class="joint" cx="826" cy="20" r="7" />
    <circle class="glove" cx="860" cy="18" r="10" />
    <path class="smallArrow" d="M 900 42 C 945 18, 998 18, 1048 42" />
    <rect class="robotBase" x="1090" y="42" width="66" height="16" rx="5" transform="rotate(12 1123 50)" />
    <circle class="joint" cx="1123" cy="42" r="8" />
    <path class="arm" d="M 1123 42 L 1151 20" />
    <path class="forearm" d="M 1151 20 L 1184 18" />
    <circle class="joint" cx="1151" cy="20" r="7" />
    <circle class="glove" cx="1184" cy="18" r="10" />
  </g>
</svg>
