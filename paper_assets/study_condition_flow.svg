<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Study condition flow</title>
  <desc id="desc">Study condition flow showing personalisation, baseline, and interaction phases and the measures collected in each condition.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .lane { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.5; rx: 18; }
      .personal { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .baseline { fill: #fefce8; stroke: #facc15; stroke-width: 2; rx: 14; }
      .interaction { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; rx: 14; }
      .shared { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.8; rx: 14; }
      .summary { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.8; rx: 14; }
      .heading { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subhead { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .text { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .mono { font: 700 12px "SFMono-Regular", Consolas, monospace; fill: #1e293b; }
      .chip { fill: #0f172a; rx: 8; }
      .chipText { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; letter-spacing: .5px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrowBlue { fill: none; stroke: #2563eb; stroke-width: 2.7; marker-end: url(#arrowBlue); }
      .arrowAmber { fill: none; stroke: #d97706; stroke-width: 2.7; marker-end: url(#arrowAmber); }
      .arrowPurple { fill: none; stroke: #7c3aed; stroke-width: 2.7; marker-end: url(#arrowPurple); }
      .bracket { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" /></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706" /></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" /></marker>
  </defs>

  <rect class="bg" width="1500" height="900" />
  <text class="title" x="56" y="58">Study condition flow</text>
  <text class="subtitle" x="56" y="86">The study separates baseline creation, notification-only breaks, and robot-mediated interaction breaks.</text>

  <rect class="lane" x="55" y="130" width="1390" height="175" />
  <rect class="lane" x="55" y="355" width="1390" height="190" />
  <rect class="lane" x="55" y="595" width="1390" height="210" />

  <!-- Personalisation -->
  <rect class="personal" x="90" y="165" width="245" height="105" />
  <rect class="chip" x="112" y="185" width="125" height="22" />
  <text class="chipText" x="124" y="201">PERSONALISATION</text>
  <text class="heading" x="112" y="232">Collect neutral data</text>
  <text class="text" x="112" y="255">SEQ + heart windows</text>

  <path class="arrowBlue" d="M 345 218 L 410 218" />

  <rect class="personal" x="420" y="165" width="245" height="105" />
  <text class="heading" x="442" y="207">Link SEQ to physiology</text>
  <text class="text" x="442" y="231">Use 5-minute lookback before</text>
  <text class="text" x="442" y="253">neutral SEQ submissions</text>

  <path class="arrowBlue" d="M 675 218 L 740 218" />

  <rect class="personal" x="750" y="165" width="245" height="105" />
  <text class="heading" x="772" y="207">Create baseline profile</text>
  <text class="text" x="772" y="231">Feature mean, SD, range</text>
  <text class="mono" x="772" y="253">calibrated threshold</text>

  <path class="arrowBlue" d="M 1005 218 L 1070 218" />

  <rect class="shared" x="1080" y="165" width="320" height="105" />
  <text class="heading" x="1102" y="207">Reusable detector input</text>
  <text class="text" x="1102" y="231">Loaded in baseline and interaction</text>
  <text class="mono" x="1102" y="253">baseline_profile.json</text>

  <!-- Baseline -->
  <rect class="baseline" x="90" y="400" width="245" height="105" />
  <rect class="chip" x="112" y="420" width="82" height="22" />
  <text class="chipText" x="124" y="436">BASELINE</text>
  <text class="heading" x="112" y="467">Monitor while seated</text>
  <text class="text" x="112" y="490">Heart + desk + calendar</text>

  <path class="arrowAmber" d="M 345 453 L 410 453" />

  <rect class="baseline" x="420" y="400" width="245" height="105" />
  <text class="heading" x="442" y="442">Detector identifies need</text>
  <text class="text" x="442" y="466">Personalised heart-state logic</text>
  <text class="text" x="442" y="488">and prolonged desk-bout trigger</text>

  <path class="arrowAmber" d="M 675 453 L 740 453" />

  <rect class="baseline" x="750" y="400" width="245" height="105" />
  <text class="heading" x="772" y="442">Notification prompt</text>
  <text class="text" x="772" y="466">Phone/watch active-break prompt</text>
  <text class="mono" x="772" y="488">accepted / rejected / timedOut</text>

  <path class="arrowAmber" d="M 1005 453 L 1070 453" />

  <rect class="summary" x="1080" y="400" width="320" height="105" />
  <text class="heading" x="1102" y="442">Self-directed active break</text>
  <text class="text" x="1102" y="466">Timer, questionnaire, daily summary</text>
  <text class="small" x="1102" y="488">No robot guidance in baseline mode</text>

  <!-- Interaction -->
  <rect class="interaction" x="90" y="642" width="245" height="120" />
  <rect class="chip" x="112" y="662" width="102" height="22" />
  <text class="chipText" x="124" y="678">INTERACTION</text>
  <text class="heading" x="112" y="709">Monitor while seated</text>
  <text class="text" x="112" y="733">Same detector inputs</text>
  <text class="small" x="112" y="754">Heart + desk + calendar</text>

  <path class="arrowPurple" d="M 345 702 L 410 702" />

  <rect class="interaction" x="420" y="642" width="245" height="120" />
  <text class="heading" x="442" y="684">Detector identifies need</text>
  <text class="text" x="442" y="708">Same personalised trigger logic</text>
  <text class="small" x="442" y="730">Context and cooldown gates still apply</text>

  <path class="arrowPurple" d="M 675 702 L 740 702" />

  <rect class="interaction" x="750" y="642" width="245" height="120" />
  <text class="heading" x="772" y="684">Robot nudge + ToF accept</text>
  <text class="text" x="772" y="708">30 s window; 2 s hand hold</text>
  <text class="mono" x="772" y="730">accepted / rejected</text>

  <path class="arrowPurple" d="M 1005 702 L 1070 702" />

  <rect class="summary" x="1080" y="642" width="320" height="120" />
  <text class="heading" x="1102" y="684">Robot-guided active break</text>
  <text class="text" x="1102" y="708">FSM boxing movements + timer</text>
  <text class="text" x="1102" y="730">Auto pre-closure or manual stop</text>
  <text class="small" x="1102" y="752">Post-break questionnaire follows</text>

  <!-- Shared notes -->
  <path class="bracket" d="M 1238 270 L 1238 396" />
  <path class="bracket" d="M 1254 270 L 1254 638" />
  <text class="small" x="1270" y="335">Personalised baseline is reused</text>
  <text class="small" x="1270" y="356">for both study conditions</text>
  <text class="small" x="1270" y="560">Baseline and interaction differ</text>
  <text class="small" x="1270" y="581">mainly in invitation delivery</text>
</svg>
