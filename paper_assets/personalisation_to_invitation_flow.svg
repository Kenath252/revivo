<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Personalisation to detection and invitation flow</title>
  <desc id="desc">Combined flow diagram showing how personalisation data create the baseline profile, and how the profile is then used during baseline or interaction conditions to detect revitalisation need and issue an invitation.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .section { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: .7px; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; rx: 12; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 12; }
      .green { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; rx: 12; }
      .amber { fill: #fffbeb; stroke: #facc15; stroke-width: 2; rx: 12; }
      .purple { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; rx: 12; }
      .red { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.8; rx: 12; }
      .diamond { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .heading { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .text { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .mono { font: 700 12px "SFMono-Regular", Consolas, monospace; fill: #1e293b; }
      .yes { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #15803d; }
      .no { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b91c1c; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrowBlue { fill: none; stroke: #2563eb; stroke-width: 2.7; marker-end: url(#arrowBlue); }
      .arrowGreen { fill: none; stroke: #16a34a; stroke-width: 2.7; marker-end: url(#arrowGreen); }
      .arrowPurple { fill: none; stroke: #7c3aed; stroke-width: 2.7; marker-end: url(#arrowPurple); }
      .arrowRed { fill: none; stroke: #dc2626; stroke-width: 2.5; marker-end: url(#arrowRed); }
      .arrowDash { fill: none; stroke: #94a3b8; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; }
      .badge { fill: #0f172a; rx: 8; }
      .badgeText { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; letter-spacing: .5px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" /></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" /></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" /></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" /></marker>
  </defs>

  <rect class="bg" width="1600" height="1100" />
  <text class="title" x="56" y="56">Personalisation, detection, and invitation flow</text>
  <text class="subtitle" x="56" y="84">Personalisation creates the participant-specific baseline; later sessions use it to decide when and how to invite an active break.</text>

  <text class="section" x="60" y="130">A. PERSONALISATION AND BASELINE CREATION</text>
  <rect class="blue" x="60" y="155" width="240" height="115" />
  <text class="heading" x="88" y="193">Personalisation session</text>
  <text class="text" x="88" y="218">Collect heart windows</text>
  <text class="text" x="88" y="241">Prompt SEQ every interval</text>

  <path class="arrowBlue" d="M 310 213 L 365 213" />

  <rect class="blue" x="375" y="155" width="250" height="115" />
  <text class="heading" x="403" y="193">SEQ responses</text>
  <text class="text" x="403" y="218">Stress score and energy score</text>
  <text class="small" x="403" y="241">Neutral if both scores >= midpoint</text>

  <path class="arrowBlue" d="M 635 213 L 690 213" />

  <rect class="blue" x="700" y="155" width="265" height="115" />
  <text class="heading" x="728" y="193">Link neutral SEQ to heart</text>
  <text class="text" x="728" y="218">Select heart windows in the</text>
  <text class="mono" x="728" y="241">5 min lookback before SEQ</text>

  <path class="arrowBlue" d="M 975 213 L 1030 213" />

  <rect class="green" x="1040" y="155" width="270" height="115" />
  <text class="heading" x="1068" y="193">Baseline profile</text>
  <text class="text" x="1068" y="218">Mean, SD, range for features</text>
  <text class="mono" x="1068" y="241">calibratedCompositeThreshold</text>

  <path class="arrowGreen" d="M 1175 270 C 1175 320, 760 320, 760 365" />

  <line class="divider" x1="60" y1="330" x2="1540" y2="330" />
  <text class="section" x="60" y="380">B. DETECTION DURING BASELINE OR INTERACTION CONDITIONS</text>

  <rect class="box" x="60" y="410" width="250" height="110" />
  <text class="heading" x="88" y="448">Continuous heart sensing</text>
  <text class="text" x="88" y="473">HR and fresh HRV samples</text>
  <text class="small" x="88" y="496">Feature windows are logged</text>

  <path class="arrow" d="M 320 465 L 385 465" />

  <rect class="box" x="395" y="410" width="250" height="110" />
  <text class="heading" x="423" y="448">Heart features</text>
  <text class="mono" x="423" y="473">hrMean, hrv/sdnn, hrSlope</text>
  <text class="small" x="423" y="496">20 s window, 10 s step</text>

  <path class="arrow" d="M 655 465 L 720 465" />

  <rect class="green" x="730" y="410" width="275" height="110" />
  <text class="heading" x="758" y="448">Personalised comparison</text>
  <text class="text" x="758" y="473">Compute oriented z-scores</text>
  <text class="text" x="758" y="496">Composite score vs threshold</text>

  <path class="arrowGreen" d="M 1015 465 L 1075 465" />

  <g transform="translate(1200 465)">
    <polygon class="diamond" points="0,-82 120,0 0,82 -120,0" />
    <text class="heading" x="-62" y="-24">Physiology</text>
    <text class="heading" x="-48" y="-2">or desk</text>
    <text class="heading" x="-56" y="20">trigger?</text>
    <text class="small" x="-75" y="48">low activation/strain</text>
    <text class="small" x="-58" y="66">or 120 min bout</text>
  </g>

  <rect class="red" x="60" y="600" width="250" height="90" />
  <text class="heading" x="88" y="635">Continue monitoring</text>
  <text class="text" x="88" y="660">If no threshold/prolonged-bout</text>
  <text class="text" x="88" y="680">trigger is present</text>

  <path class="arrowRed" d="M 1080 465 C 840 580, 455 645, 320 645" />
  <text class="no" x="780" y="585">NO</text>

  <path class="arrowGreen" d="M 1200 547 L 1200 600" />
  <text class="yes" x="1218" y="575">YES</text>

  <rect class="amber" x="1045" y="610" width="310" height="120" />
  <text class="heading" x="1075" y="648">Cooldown and availability gates</text>
  <text class="text" x="1075" y="673">5 min notification cooldown</text>
  <text class="text" x="1075" y="695">25 min quiet period after accepted break</text>
  <text class="small" x="1075" y="716">Desk work true and calendar not in meeting</text>

  <path class="arrowGreen" d="M 1200 730 L 1200 780" />

  <g transform="translate(1200 860)">
    <polygon class="diamond" points="0,-80 120,0 0,80 -120,0" />
    <text class="heading" x="-43" y="-10">Response</text>
    <text class="heading" x="-34" y="14">mode?</text>
  </g>

  <path class="arrowPurple" d="M 1080 860 L 820 860" />
  <text class="mono" x="920" y="842">interaction</text>

  <rect class="purple" x="500" y="800" width="310" height="120" />
  <text class="heading" x="530" y="838">Robot invitation</text>
  <text class="text" x="530" y="863">Robot nudge sequence</text>
  <text class="text" x="530" y="885">30 s ToF acceptance window</text>
  <text class="mono" x="530" y="907">interactionInvitation</text>

  <path class="arrow" d="M 1320 860 L 1435 860" />
  <text class="mono" x="1348" y="842">baseline</text>

  <rect class="amber" x="1168" y="960" width="330" height="100" transform="translate(0 -150)" opacity="0" />
  <rect class="amber" x="1180" y="800" width="310" height="120" />
  <text class="heading" x="1210" y="838">Baseline notification</text>
  <text class="text" x="1210" y="863">Phone/watch active-break prompt</text>
  <text class="text" x="1210" y="885">30 s response window</text>
  <text class="mono" x="1210" y="907">baselineBreakNotification</text>

  <rect class="box" x="60" y="790" width="330" height="135" />
  <text class="heading" x="88" y="828">Logged throughout</text>
  <text class="text" x="88" y="853">heart_features.jsonl</text>
  <text class="text" x="88" y="875">events.jsonl</text>
  <text class="text" x="88" y="897">daily_summary.jsonl</text>
</svg>
